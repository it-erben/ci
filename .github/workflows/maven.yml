name: Maven

on:
  workflow_call:
    inputs:
      java-version:
        description: Temurin-Version des JDK
        type: string
        default: "25"
      maven-args:
        description: Argumente für den Maven-Aufruf
        type: string
        default: "--batch-mode --errors --fail-at-end --show-version --no-transfer-progress verify"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn ${{ inputs.maven-args }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: surefire-reports-java${{ inputs.java-version }}
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: ignore
